<script>
  // 실제 사이트처럼: submit 이벤트에서 자체 검증 후 결제(order_info) 단계로 넘어가는 것을 모사한다.
  window.__SUBMIT_COUNT = 0;
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();                       // 네트워크 이동 없이 카운트만 (실 결제/이동 없음)
    window.__SUBMIT_COUNT++;
